name: Test Code Samples

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
        working-directory: ./reverse-otp-node
      - name: Check syntax
        run: find src examples -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: ./reverse-otp-node

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./reverse-otp-python
      - name: Check syntax
        run: python -m compileall -q src examples
        working-directory: ./reverse-otp-python
